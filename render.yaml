databases:
  - name: golfapp-db
    databaseName: golfapp
    user: golfapp
    plan: free

services:
  - type: web
    name: golf-handicap-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --config gunicorn.conf.py app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.5
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: golfapp-db
          property: connectionString
